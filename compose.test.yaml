name: netmap-test

services:
  test-db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: netmap_test
      POSTGRES_USER: netmap
      POSTGRES_PASSWORD: netmap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  test-backend:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://netmap:netmap@test-db:5432/netmap_test
      NETMAP_TEST_DATABASE: "1"
    depends_on:
      test-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 20

  test-runner:
    build:
      context: .
    command: ["pytest"]
    environment:
      DATABASE_URL: postgresql+psycopg://netmap:netmap@test-db:5432/netmap_test
      NETMAP_TEST_DATABASE: "1"
      TEST_BASE_URL: http://test-backend:8000
    depends_on:
      test-backend:
        condition: service_healthy
